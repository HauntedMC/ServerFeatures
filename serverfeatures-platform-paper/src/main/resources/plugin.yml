name: ServerFeatures
version: ${project.version}
main: nl.hauntedmc.serverfeatures.ServerFeatures
description: HauntedMC Feature Framework (Platform=Paper)
author: HauntedMC
website: https://hauntedmc.nl
api-version: 1.21
softdepend: [ DataRegistry, DataProvider, packetevents, PlaceholderAPI, Essentials, Vault ]

commands:
  serverfeatures:
    description: Manage server features
    usage: /serverfeatures <subcommand>
    permission: serverfeatures.use
    permission-message: You do not have permission to use this command.

permissions:
  serverfeatures.feature.combattag.bypass:
    description: Bypass CombatTag tagging, restrictions, and logout punishment.
    default: op
  serverfeatures.feature.combattag.command.status:
    description: View your own CombatTag status.
    default: true
  serverfeatures.feature.combattag.command.status.others:
    description: View another online player's CombatTag status.
    default: op
  serverfeatures.feature.combattag.command.untag:
    description: Administratively remove another player's CombatTag.
    default: op
  serverfeatures.feature.invtools.command.inventory.open.inspect:
    description: Inspect online and offline player inventories with /inv inventory open.
    default: false
  serverfeatures.feature.invtools.command.inventory.open.edit:
    description: Edit inventories opened through /inv inventory open.
    default: false
  serverfeatures.feature.invtools.command.inventory.clear:
    description: Clear online and offline player inventories with /inv inventory clear.
    default: false
  serverfeatures.feature.invtools.command.enderchest.open.inspect:
    description: Inspect online and offline player ender chests with /inv enderchest open.
    default: false
  serverfeatures.feature.invtools.command.enderchest.open.edit:
    description: Edit ender chests opened through /inv enderchest open.
    default: false
  serverfeatures.feature.invtools.command.enderchest.clear:
    description: Clear online and offline player ender chests with /inv enderchest clear.
    default: false
  serverfeatures.feature.economy.balance:
    description: View your own configured economy balances.
    default: true
  serverfeatures.feature.economy.balance.others:
    description: View another player's economy balance.
    default: op
  serverfeatures.feature.economy.pay:
    description: Transfer currencies that allow player payments.
    default: true
  serverfeatures.feature.economy.paytoggle:
    description: Toggle incoming player payments.
    default: true
  serverfeatures.feature.economy.history:
    description: View your economy transaction history.
    default: true
  serverfeatures.feature.economy.top:
    description: View enabled economy leaderboards.
    default: true
  serverfeatures.feature.economy.admin:
    description: Perform every Economy administrative action.
    default: op
  serverfeatures.feature.economy.admin.status:
    description: View Economy operational status.
    default: op
  serverfeatures.feature.economy.admin.balance:
    description: Inspect player economy balances.
    default: op
  serverfeatures.feature.economy.admin.add:
    description: Add currency to a player account.
    default: op
  serverfeatures.feature.economy.admin.remove:
    description: Remove currency from a player account.
    default: op
  serverfeatures.feature.economy.admin.set:
    description: Set a player economy balance.
    default: op
  serverfeatures.feature.economy.admin.payments:
    description: Change a player's payment setting.
    default: op
  serverfeatures.feature.economy.admin.freeze:
    description: Freeze or unfreeze economy accounts.
    default: op
  serverfeatures.feature.economy.admin.history:
    description: Inspect player transaction history.
    default: op
  serverfeatures.feature.economy.admin.verify:
    description: Run read-only Economy integrity checks.
    default: op
