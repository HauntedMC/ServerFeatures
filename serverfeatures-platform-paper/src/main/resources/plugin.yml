name: ServerFeatures
version: ${project.version}
main: nl.hauntedmc.serverfeatures.ServerFeatures
description: HauntedMC Feature Framework (Platform=Paper)
author: HauntedMC
website: https://hauntedmc.nl
api-version: 1.21
softdepend: [ DataRegistry, DataProvider, packetevents, PlaceholderAPI ]

commands:
  serverfeatures:
    description: Manage server features
    usage: /serverfeatures <subcommand>
    permission: serverfeatures.use
    permission-message: You do not have permission to use this command.

permissions:
  serverfeatures.feature.invtools.command.invsee.inspect:
    description: Inspect online and offline player inventories with /invsee.
    default: false
  serverfeatures.feature.invtools.command.invsee.edit:
    description: Edit inventories opened through /invsee.
    default: false
  serverfeatures.feature.invtools.command.endersee.inspect:
    description: Inspect online and offline player ender chests with /endersee.
    default: false
  serverfeatures.feature.invtools.command.endersee.edit:
    description: Edit ender chests opened through /endersee.
    default: false
