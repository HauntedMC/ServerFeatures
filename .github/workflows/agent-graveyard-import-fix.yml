name: Agent Graveyard import fix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graveyard-feature
          fetch-depth: 0
      - name: Apply import correction
        run: |
          set -euo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply .agent/graveyard-import-fix.patch
          rm -f .agent/graveyard-import-fix.patch
          rm -f .github/workflows/agent-graveyard-import-fix.yml
          git add -A
          git commit -m "Fix Graveyard status import"
          git push origin HEAD:agent/graveyard-feature
