name: Agent apply patch

on:
  push:
    branches:
      - agent/graveyard-feature
    paths:
      - .agent/graveyard.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graveyard-feature
      - name: Apply implementation patch
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base64 --decode .agent/graveyard.patch.gz.b64 | gzip --decompress > /tmp/graveyard.patch
          git apply --binary /tmp/graveyard.patch
          rm .agent/graveyard.patch.gz.b64
          git add -A
          git commit -m "Implement Graveyard death recovery"
          git push origin HEAD:agent/graveyard-feature
