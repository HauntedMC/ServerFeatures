name: Agent Graveyard final cleanup

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graveyard-feature
          fetch-depth: 0
      - name: Complete source fix and remove transport files
        run: |
          set -euo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path('serverfeatures-platform-paper/src/main/java/nl/hauntedmc/serverfeatures/features/graveyard/capture/GraveCaptureService.java')
          content = path.read_text()
          if 'import java.util.Locale;' not in content:
              content = content.replace(
                  'import java.util.List;\n',
                  'import java.util.List;\nimport java.util.Locale;\n'
              )
              path.write_text(content)
          PY
          rm -f .agent/graveyard-missing-files.patch.gz.b64
          rm -f .agent/final.part-00 .agent/final.part-01
          rm -f .github/workflows/agent-graveyard-missing-files.yml
          git add -A
          git commit -m "Complete Graveyard runtime fix coverage"
          git push origin HEAD:agent/graveyard-feature
