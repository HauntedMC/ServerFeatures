name: Agent Graveyard missing files

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graveyard-feature
          fetch-depth: 0
      - name: Apply missing source and tests
        run: |
          set -euo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tr -d '[:space:]' < .agent/graveyard-missing-files.patch.gz.b64 > /tmp/graveyard-missing-files.patch.gz.b64
          base64 --decode /tmp/graveyard-missing-files.patch.gz.b64 > /tmp/graveyard-missing-files.patch.gz
          gzip --test /tmp/graveyard-missing-files.patch.gz
          gzip --decompress --stdout /tmp/graveyard-missing-files.patch.gz > /tmp/graveyard-missing-files.patch
          git apply --check --binary /tmp/graveyard-missing-files.patch
          git apply --binary /tmp/graveyard-missing-files.patch
          rm -f .agent/graveyard-missing-files.patch.gz.b64
          rm -f .agent/final.part-00 .agent/final.part-01
          rm -f .github/workflows/agent-graveyard-missing-files.yml
          git add -A
          git commit -m "Complete Graveyard runtime fix coverage"
          git push origin HEAD:agent/graveyard-feature
