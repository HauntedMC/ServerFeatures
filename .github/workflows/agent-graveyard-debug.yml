name: Agent Graveyard runtime fixes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graveyard-feature
          fetch-depth: 0
      - name: Apply verified Graveyard correction
        run: |
          set -euo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat .agent/graveyard-fix.patch.part-* > /tmp/graveyard-fix.patch.gz.b64
          actual="$(sha256sum /tmp/graveyard-fix.patch.gz.b64 | cut -d' ' -f1)"
          test "$actual" = "70547982cc09374a399eedfa75155f905eb2727263487ed0aebd1261066fd2eb"
          base64 --decode /tmp/graveyard-fix.patch.gz.b64 | gzip --decompress > /tmp/graveyard-fix.patch
          git apply --binary /tmp/graveyard-fix.patch
          rm -f .agent/graveyard-fix.patch.b64 .agent/graveyard-fix.patch.part-*
          rm -f .github/workflows/agent-graveyard-debug.yml
          git add -A
          git commit -m "Fix Graveyard rendering, identifiers, and lifecycle"
          git push origin HEAD:agent/graveyard-feature
