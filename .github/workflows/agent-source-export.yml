name: Agent Graveyard workspace

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graveyard-feature
          fetch-depth: 0
      - name: Apply pending update patch
        if: ${{ hashFiles('.agent/update.patch.gz.b64') != '' }}
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base64 --decode .agent/update.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/graveyard-update.patch
          git apply --binary /tmp/graveyard-update.patch
          rm .agent/update.patch.gz.b64
          git add -A
          git commit -m "Fix Graveyard implementation"
          git push origin HEAD:agent/graveyard-feature
      - uses: actions/upload-artifact@v4
        with:
          name: serverfeatures-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
