name: Agent Graveyard workspace

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graveyard-feature
          fetch-depth: 0
      - name: Apply pending implementation patch
        if: ${{ hashFiles('.agent/graveyard.patch.gz.b64.part-*') != '' }}
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat .agent/graveyard.patch.gz.b64.part-* | base64 --decode | gzip --decompress > /tmp/graveyard.patch
          git apply --binary /tmp/graveyard.patch
          rm .agent/graveyard.patch.gz.b64.part-*
          git add -A
          git commit -m "Implement Graveyard death recovery"
          git push origin HEAD:agent/graveyard-feature
      - uses: actions/upload-artifact@v4
        with:
          name: serverfeatures-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
