name: Agent source export

on:
  push:
    branches:
      - agent/graveyard-feature
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: serverfeatures-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
