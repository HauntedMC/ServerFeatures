name: Apply economy review fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/economy-review-fixes.patch.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/economy-review-fixes.patch.gz.b64 | gzip --decompress > /tmp/economy-review-fixes.patch
          echo "ead634e38a13dbf9379e2552c6867cb9f29646cb6663e977467c887475434361  /tmp/economy-review-fixes.patch" | sha256sum --check
          git apply --index /tmp/economy-review-fixes.patch
          rm -f .github/workflows/apply-economy-review-fixes.yml
          git add -A
          git diff --cached --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden economy transaction semantics"
          git push
