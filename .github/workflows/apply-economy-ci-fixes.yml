name: Apply economy CI fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          removals = {
              Path('serverfeatures-platform-paper/src/main/java/nl/hauntedmc/serverfeatures/features/economy/command/CurrencyCommand.java'):
                  'import nl.hauntedmc.serverfeatures.api.economy.EconomyMutationRequest;\n',
              Path('serverfeatures-platform-paper/src/main/java/nl/hauntedmc/serverfeatures/features/economy/vault/VaultEconomyProvider.java'):
                  'import nl.hauntedmc.serverfeatures.api.economy.EconomyResultStatus;\n',
          }
          for path, line in removals.items():
              content = path.read_text()
              if line not in content:
                  raise SystemExit(f'missing expected import in {path}')
              path.write_text(content.replace(line, '', 1))

          path = Path('serverfeatures-platform-paper/src/main/java/nl/hauntedmc/serverfeatures/framework/loader/FeatureDescriptor.java')
          content = path.read_text()
          old = '''        if (!featureDependencies.isEmpty() && !optionalFeatureDependencies.isEmpty()) {\n            LinkedHashSet<String> optional = new LinkedHashSet<>(optionalFeatureDependencies);\n            optional.removeIf(candidate -> featureDependencies.stream().anyMatch(candidate::equalsIgnoreCase));\n'''
          new = '''        if (!featureDependencies.isEmpty() && !optionalFeatureDependencies.isEmpty()) {\n            Set<String> requiredDependencies = featureDependencies;\n            LinkedHashSet<String> optional = new LinkedHashSet<>(optionalFeatureDependencies);\n            optional.removeIf(candidate -> requiredDependencies.stream().anyMatch(candidate::equalsIgnoreCase));\n'''
          if old not in content:
              raise SystemExit('missing expected FeatureDescriptor block')
          path.write_text(content.replace(old, new, 1))

          path = Path('serverfeatures-platform-paper/src/main/java/nl/hauntedmc/serverfeatures/features/economy/persistence/EconomyRejectedException.java')
          content = path.read_text()
          old = '''final class EconomyRejectedException extends RuntimeException {\n    private final EconomyResultStatus status;\n'''
          new = '''final class EconomyRejectedException extends RuntimeException {\n    private static final long serialVersionUID = 1L;\n\n    private final EconomyResultStatus status;\n'''
          if old not in content:
              raise SystemExit('missing expected exception block')
          path.write_text(content.replace(old, new, 1))
          PY

          rm -f .github/workflows/apply-economy-ci-fixes.yml
          git add -A
          git diff --cached --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix economy compilation and lint"
          git push
