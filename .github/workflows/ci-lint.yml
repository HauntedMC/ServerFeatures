name: CI Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  lint:
    name: Checkstyle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      - run: ./mvnw -U -B -ntp -DskipTests checkstyle:check
      - run: shellcheck update_version.sh serverfeatures-platform-acceptance/run-platform-acceptance.sh

  recover-lottery-draw:
    name: Finalize Lottery draw recovery
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/lottery-feature'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/lottery-feature
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      - name: Apply and validate recovery fix
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PACKAGES_USER"
          test -n "$PACKAGES_TOKEN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          service = Path(
              'serverfeatures-platform-paper/src/main/java/nl/hauntedmc/serverfeatures/'
              'features/lottery/service/LotteryService.java'
          )
          source = service.read_text(encoding='utf-8')
          old = '''    private void refreshRound() {
              submit(() -> repository.currentRound(settings.lotteryKey()))
                      .whenComplete((round, failure) -> {
                          if (failure == null && round.isPresent() && !closed.get()) {
                              main(() -> updateSnapshot(round.get()));
                          }
                      });
          }
          '''
          new = '''    private void refreshRound() {
              String seed = drawEngine.newSeed();
              submit(() -> repository.ensureOpenRound(
                              settings,
                              seed,
                              drawEngine.commitment(seed),
                              now()
                      ))
                      .whenComplete((round, failure) -> {
                          if (failure == null && round != null && !closed.get()) {
                              main(() -> updateSnapshot(round));
                          } else if (failure != null) {
                              log("Could not refresh Lottery round", failure);
                          }
                      });
          }
          '''
          if old not in source:
              raise SystemExit('LotteryService refreshRound anchor is missing')
          service.write_text(source.replace(old, new, 1), encoding='utf-8')

          docs = Path('docs/features/lottery.md')
          text = docs.read_text(encoding='utf-8')
          anchor = 'The active row is pessimistically locked for all round mutations.'
          replacement = (
              anchor
              + ' The normal 30-second round refresh also reopens a stale interrupted draw, '
              + 'so no separate maintenance task is needed.'
          )
          if 'reopens a stale interrupted draw' not in text:
              if anchor not in text:
                  raise SystemExit('Lottery documentation recovery anchor is missing')
              text = text.replace(anchor, replacement, 1)
          docs.write_text(text, encoding='utf-8')
          PY

          git diff --check
          ./mvnw -U -B -ntp -DskipTests checkstyle:check
          ./mvnw -U -B -ntp verify
          ./mvnw -U -B -ntp -Pplatform-acceptance verify

          git show origin/main:.github/workflows/ci-lint.yml > .github/workflows/ci-lint.yml
          git add -A
          git commit -m 'Recover stale Lottery draws during normal refresh'
          git push origin HEAD:agent/lottery-feature
