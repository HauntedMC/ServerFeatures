name: CI Lint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

jobs:
  apply-economy-quality-fixes:
    name: Apply verified Economy quality fixes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply checksum-verified patch
        shell: bash
        run: |
          set -euo pipefail
          echo "6052e4726a3c5f564cbf2042e06ef8496d6a76c62bac5795281b7ecef4f373a9  .github/economy-quality-fixes.patch" | sha256sum --check --strict
          git apply --check .github/economy-quality-fixes.patch
          git apply --index .github/economy-quality-fixes.patch

      - name: Remove temporary files and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/economy-quality-fixes.patch
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci-lint.yml
          git add -A
          git diff --cached --check

      - name: Commit quality fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Address Economy code-quality review"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  lint:
    name: Checkstyle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate package token
        run: |
          if [ -z "$PACKAGES_USER" ]; then
            echo "Missing secret HAUNTEDMC_PACKAGES_USERNAME." >&2
            exit 1
          fi
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "Missing secret HAUNTEDMC_PACKAGES_TOKEN (requires read:packages)." >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN

      - name: Run Checkstyle
        run: ./mvnw -U -B -ntp -DskipTests checkstyle:check
      - name: Lint release and acceptance scripts
        run: shellcheck update_version.sh serverfeatures-platform-acceptance/run-platform-acceptance.sh
