name: Apply Graveyard retention hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graveyard-feature
          fetch-depth: 0
      - name: Apply verified retention patch
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat .agent/graveyard-retention.patch.part-* > /tmp/graveyard-retention.patch.gz.b64
          expected="$(tr -d '[:space:]' < .agent/graveyard-retention.patch.ready)"
          actual="$(sha256sum /tmp/graveyard-retention.patch.gz.b64 | cut -d' ' -f1)"
          test "$actual" = "$expected"
          base64 --decode /tmp/graveyard-retention.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/graveyard-retention.patch
          git apply /tmp/graveyard-retention.patch
          rm .agent/graveyard-retention.patch.ready .agent/graveyard-retention.patch.part-*
          rm .github/workflows/agent-graveyard-retention.yml
          git add -A
          git commit -m "Add Graveyard retention cleanup"
          git push origin HEAD:agent/graveyard-feature
