name: Apply final Economy production hardening

on:
  pull_request:
    types:
      - synchronize

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/advanced-economy'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply reviewed hardening
        run: python .github/economy_final_validation.py

      - name: Remove temporary transport
        run: rm .github/economy_final_validation.py .github/workflows/apply-economy-final-validation.yml

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Economy for production operation"
          git push
