name: Diagnose economy implementation payload

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Report payload segment integrity
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/economy-patch/*
          sha256sum .github/economy-patch/*
          cat .github/economy-patch/* > /tmp/economy.patch.gz.b64
          wc -c /tmp/economy.patch.gz.b64
          sha256sum /tmp/economy.patch.gz.b64
