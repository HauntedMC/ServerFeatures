name: Apply economy implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/economy-patch/* > /tmp/economy.patch.gz.b64
          echo "2a4cce8678a90f16994f2e875465f7dc99f6315568af13d1dbe4e5bdd15af4ab  /tmp/economy.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/economy.patch.gz.b64 | gzip --decompress > /tmp/economy.patch
          git apply --index /tmp/economy.patch

      - name: Remove temporary transport files
        shell: bash
        run: |
          rm -rf .github/economy-patch
          rm -f .github/workflows/apply-economy-patch.yml
          rm -f .github/workflows/source-snapshot.yml
          git add -A

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement advanced multi-currency economy"
          git push
